    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('everykr_theme');
          var isDark =
            savedTheme === 'dark' ||
            (savedTheme !== 'light' &&
              (!window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches));
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('everykr_language') || 'en';
          document.documentElement.lang = savedLang;
          document.documentElement.dir =
            savedLang === 'ur' || savedLang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
    <script id="everykr-jsonld" type="application/ld+json">

        "description": "All-in-one digital platform for international students in South Korea: university admission, visa guides, jobs, accommodation, community, marketplace, and daily life guidance."
