/* ===== AI guide ===== */
const log=$("#log");
function bot(t,u){const d=document.createElement("div");d.className="m"+(u?" u":"");d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
$("#fab").onclick=()=>{const o=$("#chat").classList.toggle("open");$("#fab").setAttribute("aria-expanded",o);if(o)$("#ci").focus()};
$("#x").onclick=()=>{$("#chat").classList.remove("open");$("#fab").setAttribute("aria-expanded",false)};
$("#cf").onsubmit=async e=>{e.preventDefault();const v=$("#ci").value.trim();if(!v)return;$("#ci").value="";bot(v,1);
 if(!CFG.chat){bot(T[lang].nochat);return}
 try{bot(await CFG.chat(v,lang))}catch(err){bot("…")}};

/* ===== Lower homepage ===== */
let ex=0,unsub=false;
function pan(){const e=$("#pr");if(!e)return;const v=(active||T[lang].glob)+" → South Korea";if(e.textContent!==v){e.textContent=v;if(!RM)e.animate([{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{duration:600,easing:"cubic-bezier(.16,1,.3,1)"})}}
async function loadUnis(){const g=$("#ugrid");if(!CFG.universities){g.innerHTML=`<div class="note">${T[lang].uniEmpty}</div>`;return}
 g.innerHTML='<div class="sk"></div>'.repeat(4);
 try{const r=await CFG.universities();g.innerHTML=r&&r.length?r.slice(0,8).map(u=>`<a class="uc" href="${esc(u.url||"#")}"><b>${esc(u.name)}</b><br><small>${esc(u.city||"")}</small></a>`).join(""):`<div class="note">${T[lang].uniEmpty}</div>`}catch(e){g.innerHTML=`<div class="note">${T[lang].err}</div>`}}
function drawer(o){$("#drawer").classList.toggle("open",o);$("#burger").setAttribute("aria-expanded",o);if(o)$("#dx").focus();else $("#burger").focus()}
function extra(){const t=T[lang];
 $$("[data-c]").forEach(e=>e.textContent=t.cats[e.dataset.c]);
 $("#em").placeholder=t.em;$("#burger").setAttribute("aria-label",t.menu);$("#nb").textContent=t[unsub?"nlUn":"nlBtn"];
 $("#cc").innerHTML=Object.keys(C).map(n=>`<button class="chip" data-n="${n}">${n}</button>`).join("");
 const m=CFG.contact&&CFG.contact.email;$("#fc").innerHTML=m?`<a href="mailto:${esc(m)}">${esc(m)}</a>`:"";
 loadUnis();
 if(ex&&!RM)[$("#h1"),$(".lead"),$("#chips")].forEach(el=>el.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:650,easing:"cubic-bezier(.16,1,.3,1)"}));
 if(ex)return;ex=1;
 new IntersectionObserver(e=>{vis=e[0].isIntersecting}).observe($(".globe-wrap"));
 $("#kz").onclick=()=>{zoomed=!zoomed;$("#kz").setAttribute("aria-pressed",zoomed);hold=false;if(zoomed){tRot=-KR[0];tPit=KR[1];ease=true;tZoom=2.4}else{tZoom=1;focus()}};
 if(!RM&&!LP){let pq=0;addEventListener("scroll",()=>{if(!pq)pq=requestAnimationFrame(()=>{pq=0;document.documentElement.style.setProperty("--py",scrollY)})},{passive:true})}
 $("#burger").onclick=()=>drawer(true);$("#dx").onclick=()=>drawer(false);
 $("#drawer").addEventListener("click",e=>{if(e.target.closest("a"))drawer(false)});
 addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#drawer").classList.contains("open"))drawer(false)});
 $("#lang2").onchange=e=>applyLang(e.target.value,true);
 $("#cc").onclick=e=>{const b=e.target.closest(".chip");if(b){setOrigin(b.dataset.n);scrollTo({top:0,behavior:RM?"auto":"smooth"})}};
 $("#nu").onclick=()=>{unsub=!unsub;$("#nu").setAttribute("aria-pressed",unsub);$("#nb").textContent=T[lang][unsub?"nlUn":"nlBtn"]};
 $("#nf").onsubmit=async e=>{e.preventDefault();const s=$("#ns"),n=CFG.newsletter,f=n&&(unsub?n.unsubscribe:n.subscribe);if(!f){s.textContent=T[lang].nlNo;return}
  s.textContent="…";try{await f($("#em").value,lang);s.textContent=T[lang].nlOk}catch(x){s.textContent=T[lang].err}};
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
 $$(".rv").forEach(e=>io.observe(e))}
applyLang(lang,false);
requestAnimationFrame(frame);
</script>
</body>
</html>
